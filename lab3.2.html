<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 3 - Позиціонування</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #2b2b2b;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .menu-container {
            width: 280px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 55px 15px 35px 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            position: relative;
        }
        .menu-header {
            position: absolute;
            top: -15px;
            left: 10px;
            right: 10px;
            background: linear-gradient(180deg, #1c262b 0%, #0d1214 100%);
            border: 1px solid #000;
            border-bottom: 2px solid #00a2ff;
            border-radius: 8px;
            padding: 12px 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            z-index: 2;
        }
        .main-title {
            color: #00a2ff;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 3px;
            text-shadow: 0 0 8px rgba(0, 162, 255, 0.4);
        }
        .sub-title {
            color: #7b8d9a;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .menu-list {
            list-style: none;
            margin-bottom: 15px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #111;
        }
        .menu-list li {
            display: flex;
            align-items: center;
            background: linear-gradient(180deg, #282828 0%, #202020 100%);
            border-top: 1px solid #353535;
            border-bottom: 1px solid #141414;
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-list li:hover {
            background: linear-gradient(180deg, #303030 0%, #252525 100%);
        }
        .icon-block {
            width: 25px;
            display: flex;
            justify-content: center;
            color: #00a2ff;
            font-size: 16px;
            margin-right: 12px;
        }
        .menu-text {
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .order-button {
            width: 100%;
            padding: 10px 0;
            background: linear-gradient(180deg, #00b4ff 0%, #0072bc 100%);
            border: 1px solid #00568c;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        .order-button:hover {
            background: linear-gradient(180deg, #1ac0ff 0%, #0082d6 100%);
        }
        .footer-design {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #e6e6e6 0%, #a6a6a6 100%);
            color: #222222;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 20px;
            border-radius: 0 0 5px 5px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.6);
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="menu-header">
            <h1 class="main-title">GRAND SPORT</h1>
            <p class="sub-title">ВЕЛИКИЙ СПОРТ - ВЕЛИКИЙ ВИБІР</p>
        </div>

        <ul class="menu-list">
            <li>
                <div class="icon-block"><i class="fas fa-shopping-cart"></i></div>
                <span class="menu-text">КАТАЛОГ</span>
            </li>
            <li>
                <div class="icon-block"><i class="fas fa-pencil-alt"></i></div>
                <span class="menu-text">РОЗМІРИ</span>
            </li>
            <li>
                <div class="icon-block"><i class="fas fa-exchange-alt"></i></div>
                <span class="menu-text">ДОСТАВКА</span>
            </li>
            <li>
                <div class="icon-block"><i class="fas fa-phone-alt"></i></div>
                <span class="menu-text">КОНТАКТИ</span>
            </li>
            <li>
                <div class="icon-block"><i class="fas fa-comment-dots"></i></div>
                <span class="menu-text">ВІДГУКИ</span>
            </li>
        </ul>
        <button class="order-button">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
        <div class="footer-design">Design by SKY</div>
    </div>
</body>
</html>
